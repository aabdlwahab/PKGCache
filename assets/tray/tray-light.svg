<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="pkgcache">
  <!-- The brackets and the block from assets/logo.svg, with the rounded card behind them
       removed. A status bar icon sits on the panel's own background, so a filled tile
       reads as a sticker rather than as part of the bar; and it is one flat colour so the
       two variants can be swapped for a light or dark panel. -->
  <path d="M13 8 H9 V24 H13" fill="none" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M19 8 H23 V24 H19" fill="none" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="14.4" y="13.6" width="3.2" height="4.8" rx="1" fill="#ffffff"/>
</svg>
