[project]
name = "pkgcache"
version = "0.1.0"
description = "One Python codebase for four pull-through package caches (OCI / npm / PyPI / apt+apk)"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.139.2",
    "uvicorn[standard]==0.51.0",
    "httpx==0.28.1",
    "aiofiles==25.1.0",
    "pyyaml==6.0.3",
]

[project.optional-dependencies]
# Test suite (pkgcache/tests). Install with: pip install -e '.[test]'
test = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
]

[project.scripts]
pkgcache = "pkgcache.__main__:main"

[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pkgcache"]

[tool.pytest.ini_options]
# The router's end-to-end tests are async; auto mode runs them without per-test markers.
asyncio_mode = "auto"
testpaths = ["tests"]
