name: Site

# The pkgcache client site, published to GitHub Pages.
#
# Static files, copied as they are. There is no build step and nothing is generated,
# which is the same bargain the console makes: the file the browser fetches is the file
# in the repository, so a change can be read in the diff rather than inferred from a
# pipeline.
#
# It is deliberately not triggered by a release. The download matrix asks the GitHub
# Releases API in the reader's browser, so a tag published an hour from now shows up
# without this workflow running again — which is the whole reason that choice was made.
#
# One thing has to be done by hand, once: Settings → Pages → Source: GitHub Actions.
# Until then this workflow fails at the configure step with a message saying so.

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time, and a newer commit wins. Two merges in a minute should not
# race to publish, and the older of them has nothing worth waiting for.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # The site is served from a subdirectory — <user>.github.io/PKGCache/ — so every
      # path in it is relative. This is the cheap check that it stayed that way: an
      # absolute href works perfectly on a local server rooted at the site and 404s in
      # production, which is the worst kind of mistake to find after deploying.
      - name: Refuse absolute paths, and anything that expects a live cache
        run: |
          set -euo pipefail
          bad=0
          if grep -rn 'href="/\|src="/' site/ ; then
            echo "::error::absolute path in site/ — it will 404 under /PKGCache/"
            bad=1
          fi
          if grep -rn '/api/v1\|coords\.js' site/ ; then
            echo "::error::site/ refers to a running instance's API"
            bad=1
          fi
          [ "$bad" -eq 0 ]
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
