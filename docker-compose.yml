# Six pull-through caching roles (OCI / npm / PyPI / apt+apk / git / files) as ONE
# Python container (./pkgcache) running one process on TWO ports: the unified HTTPS
# port :8443 carries docker (/v2/…) plus npm/pypi/git/files (/<project>/<role>/…),
# and :3142 is the apt/apk plain-HTTP forward proxy (proxy clients can't speak TLS,
# so it can't share the unified port). TLS terminates in-process from ./certs — no
# separate TLS proxy. Everything is written into ./caches/<eco> (DVC-tracked).
#
# Bring up online side:     docker compose --profile online up -d
# Bring up air-gapped side: OFFLINE=1 docker compose --profile offline up -d
#
# OFFLINE=1 makes every role serve from cache only and never reach upstream — this
# is the air-gap mode (a cache miss simply fails). Run scripts/gen-certs.sh once
# before `up` to populate ./certs.

# Pin the compose project name so every invocation — any directory name, any shell,
# systemd, the CLI — manages the SAME stack instead of deriving a name from the
# checkout directory's basename.
name: package-registry

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ---- optional client/build DNS -----------------------------------------
  # This forwarding resolver makes the stable pkgcache.internal name visible to
  # machines and build containers that use it as DNS. It is deliberately opt-in:
  #
  #   PKGCACHE_DNS_IP=10.20.30.40 docker compose --profile dns up -d dns
  #
  # Non-pkgreg names are forwarded through Docker's resolver. Publish on a specific
  # interface with PKGCACHE_DNS_BIND when the host has more than one network.
  dns:
    build: ./dnsmasq
    image: package-registry/dnsmasq:local
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /run
    cap_drop: ["ALL"]
    cap_add: ["NET_BIND_SERVICE", "SETGID", "SETUID"]
    security_opt: ["no-new-privileges:true"]
    logging: *default-logging
    environment:
      PKGCACHE_DNS_NAME: "${PKGCACHE_DNS_NAME:-pkgcache.internal}"
      PKGCACHE_DNS_IP: "${PKGCACHE_DNS_IP:-}"
    ports:
      - "${PKGCACHE_DNS_BIND:-0.0.0.0}:53:53/udp"
      - "${PKGCACHE_DNS_BIND:-0.0.0.0}:53:53/tcp"
    healthcheck:
      test: ["CMD", "nslookup", "${PKGCACHE_DNS_NAME:-pkgcache.internal}", "127.0.0.1"]
      interval: 10s
      timeout: 3s
      retries: 5
    profiles: ["dns"]

  # ---- the cache (all four roles, one process) ---------------------------
  pkgcache:
    build: ./pkgcache
    image: package-registry/pkgcache:local
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    logging: *default-logging
    # Run as the host user so everything written under ./caches is host-owned, not
    # root — this is what lets the webui's `dvc add`/`dvc checkout` and the operator
    # manage the cache without permission fights. All ports are >1024, so a non-root
    # process can bind them. IDs come from .env — written by scripts/bootstrap.sh;
    # REQUIRED (no silent fallback: a wrong uid means root-owned cache files).
    user: "${PKGCACHE_UID:?run ./scripts/bootstrap.sh first}:${PKGCACHE_GID:?run ./scripts/bootstrap.sh first}"
    environment:
      OFFLINE: "${OFFLINE:-0}"
      PKGCACHE_CACHE_ROOT: /caches
      # The project registry the control UI manages. A project is a name (routed by
      # URL prefix on the shared ports) + its own cache tree under
      # /caches/projects/<name>. Read-only here; the webui is the only writer.
      PKGCACHE_PROJECTS: /config/projects.json
      PKGCACHE_TLS_CERT: /certs/server.crt
      PKGCACHE_TLS_KEY: /certs/server.key
      HOME: /tmp           # an arbitrary uid has no passwd home; keep libs that expand ~ happy
      # The host uid has no /etc/passwd entry in the image, so getpass.getuser()
      # (used by dvc, and some libs) would crash with KeyError. Name it explicitly.
      USER: pkgcache
      LOGNAME: pkgcache
    ports:
      # THE port: docker pull <host>:8443/[<project>/]{dockerhub,ghcr,quay}/<image>;
      # npm/pypi/git/files at https://<host>:8443/<project>/<role>/… ("global" is the
      # default project). Publish "443:8443" instead for port-less docker URLs (the
      # container binds >1024 because it runs as a non-root host uid).
      - "${PKGCACHE_BIND:-0.0.0.0}:8443:8443"
      # apt + apk (HTTP forward proxy; project = proxy username <project>@host)
      - "${PKGCACHE_BIND:-0.0.0.0}:3142:3142"
      # Projects are NOT separate ports: every project shares the two ports above and
      # is reached by a URL prefix (/<project>/<role>/… ; the OCI project rides the
      # image name, the apt project the proxy username). See pkgcache/unified.py.
    volumes:
      - ./caches:/caches        # global → /caches/<eco>; projects → /caches/projects/<name>/<eco>
      - ./config:/config:ro     # the project registry (config/projects.json), webui-managed
      # The serving process gets only public trust material + its leaf key. Never
      # mount the CA signing key into a network-facing container.
      - ./certs/ca.crt:/certs/ca.crt:ro
      - ./certs/server.crt:/certs/server.crt:ro
      - ./certs/server.key:/certs/server.key:ro
    networks:
      default:
        aliases: ["pkgcache"]
    profiles: ["online", "offline"]

  # ---- control UI --------------------------------------------------------
  # Own profile ("ui"), deliberately NOT in online/offline so a checkpoint's
  # `docker compose stop` never takes it down with the cache. Bring it up
  # alongside a cache profile, e.g.:
  #   docker compose --profile online --profile ui up -d
  #
  # webui is now the API backend only: the React console (`console` service)
  # is the public entry on :8088 and reverse-proxies /api here. webui is reached
  # over the compose network as webui:8088, so it no longer publishes a host port.
  webui:
    build: ./webui
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    logging: *default-logging
    expose: ["8088"]       # internal only — the console proxies /api to it
    # Same host-user mapping as pkgcache, so the cache repo's git objects, the DVC
    # store and manifests this service writes are owned by the operator, never root
    # (root-owned git objects are exactly what blocked the host from committing).
    # No docker socket and no docker group: mode changes are registry writes the
    # cache process applies live (see webui/app/services/operations.py mode()),
    # status is an HTTP health probe — this container has no power over the host.
    user: "${PKGCACHE_UID:?run ./scripts/bootstrap.sh first}:${PKGCACHE_GID:?run ./scripts/bootstrap.sh first}"
    environment:
      UI_HOST: 0.0.0.0
      HOME: /tmp           # writable home for git/dvc config under an arbitrary uid
      USER: pkgcache       # uid has no /etc/passwd entry; dvc's getpass.getuser() needs this
      LOGNAME: pkgcache
      # Break-glass superuser (from .env). Setting these turns ON control-plane auth:
      # login + account/ownership enforcement. Leave unset to keep the API open.
      UI_ROOT_USER: "${UI_ROOT_USER:-}"
      UI_ROOT_PASSWORD: "${UI_ROOT_PASSWORD:-}"
      # Set to the browser-facing origin when TLS terminates at a host proxy. This
      # also makes session cookies Secure by default.
      UI_PUBLIC_ORIGIN: "${UI_PUBLIC_ORIGIN:-}"
      UI_COOKIE_SECURE: "${UI_COOKIE_SECURE:-}"
      UI_SESSION_TTL: "${UI_SESSION_TTL:-43200}"
      UI_MAX_JSON_MB: "${UI_MAX_JSON_MB:-64}"
      # On by default; the console proxy sanitizes X-Forwarded-For. Set 0 only if
      # webui is exposed without a trusted proxy in front.
      UI_TRUST_PROXY: "${UI_TRUST_PROXY:-1}"
      # Let un-authenticated callers browse the console read-only (writes still need a
      # login). Off by default; set UI_ANON_READ=1 to enable.
      UI_ANON_READ: "${UI_ANON_READ:-0}"
      PKGCACHE_SHUTTLE: /app/shuttle
      # HOME/USER/LOGNAME above already give dvc a writable home under the read-only
      # rootfs; also disable its analytics id write — a serving host shouldn't phone
      # home, and it removes one more write off the happy path.
      DVC_NO_ANALYTICS: "1"
    working_dir: /app
    volumes:
      # Mount mutable state only; the application source is baked into the image.
      - ./caches:/app/caches
      - ./config:/app/config
      - ./lockwarm:/app/lockwarm
      - "${PKGCACHE_SHUTTLE:-./shuttle}:/app/shuttle"
      # Offline export/import needs the serving cert and leaf key, never ca.key.
      - ./certs/ca.crt:/app/certs/ca.crt
      - ./certs/server.crt:/app/certs/server.crt
      - ./certs/server.key:/app/certs/server.key
    profiles: ["ui"]

  # There is no console service any more.
  #
  # The browser console used to be a React bundle served by its own nginx container,
  # built from ./webui/console. It is now written by hand and compiled into the pkgreg
  # binary, so the Go server serves it at /console with no extra image, no Node in the
  # build, and no reverse proxy in front. `pkgreg serve --headless` turns it off for
  # deployments that only ever talk to the API.
  #
  # The `webui` service above remains the Python API backend for this legacy stack.
