<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>pkgcache</title>
    <!-- Same pre-paint theme read as the console: this window is usually opened beside
         it, and two surfaces disagreeing about the theme for one frame is worse here
         because the whole window is 420px of it. -->
    <script src="/theme.js"></script>
    <link rel="stylesheet" href="/tokens.css" />
    <!-- The console's stylesheet carries the shared components this reuses — meters,
         pills, buttons, the loading state — so the widget stylesheet is only the parts
         that are genuinely its own: a one-column layout at 420px. -->
    <link rel="stylesheet" href="/console/console.css" />
    <link rel="stylesheet" href="/console/widget.css" />
    <!-- This binary's mark: pkgreg's on the server, pkgcache's on a machine cache. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script type="module" src="/console/widget.js"></script>
  </head>
  <body class="widget-body">
    <div id="root" class="booting">Reading the cache…</div>
    <noscript>
      This window needs JavaScript. <code>pkgcache status</code> reports the same
      things, and does not.
    </noscript>
  </body>
</html>
