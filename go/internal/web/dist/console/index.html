<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>pkgreg console</title>
    <!-- Apply the persisted theme before first paint, so there is no flash of
         token-less content while the modules load. -->
    <script src="/theme.js"></script>
    <link rel="stylesheet" href="/tokens.css" />
    <link rel="stylesheet" href="/console/console.css" />
    <!-- This binary's mark: pkgreg's on the server, pkgcache's on a machine cache. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Native ES modules. The browser resolves these imports itself; there is no
         bundler, and the file served is the file in the repository. -->
    <script type="module" src="/console/boot.js"></script>
  </head>
  <body>
    <div id="root" class="booting">Loading control plane…</div>
    <noscript>
      The console needs JavaScript. The control API at <code>/api/v1</code> does not,
      and <code>pkgreg</code> on the command line does everything this page does.
    </noscript>
  </body>
</html>
